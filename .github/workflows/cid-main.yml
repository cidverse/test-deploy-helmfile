# cid-workflow-version: 0.11.12

# This file is generated by the CID Workflow GitHub App.
# DO NOT EDIT!

# name
name: 'CI - Main'

# triggers
on:
  workflow_dispatch:
    inputs:
      loglevel:
        description: Log level
        required: true
        default: info
        type: choice
        options:
          - trace
          - debug
          - info
          - warn
          - error
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'renovate.json'
      - 'CODEOWNERS'
      - 'SECURITY.md'

# permissions, see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions and https://docs.github.com/en/rest/overview/permissions-required-for-github-apps
permissions:
  actions: read # required: detect GitHub Actions runtime environment
  checks: none # not required
  contents: read # required: read repository content
  deployments: none # not required
  id-token: none # not required
  issues: none # not required
  packages: none # not required
  pages: none # not required
  pull-requests: none # not required
  repository-projects: none # not required
  security-events: none # not required
  statuses: none # not required

# cancel in progress when a new run starts
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  CID_WORKFLOW: 'main'
  CID_LOGLEVEL: "${{ github.event.inputs.loglevel || 'info' }}"
  # allowed modes are 'block' and 'audit'. Using https://github.com/step-security/harden-runner to harden the runner.
  EGRESS_POLICY: 'block'

# jobs
jobs:
  # helmfile-lint [deployment-helmfile-dev]
  helmfile-lint-deployment-helmfile-dev:
    name: 'helmfile-lint [deployment-helmfile-dev]'
    runs-on: ubuntu-26.04
    permissions:
      actions: read # required: query workflow run metadata
      contents: read # required: checkout / repository metadata
      id-token: write # required: provenance signing
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-telemetry: true
          egress-policy: "${{ env.EGRESS_POLICY }}"
          allowed-endpoints: >-
            keyserver.ubuntu.com:443
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Prepare Tooling
        shell: bash
        run: bash .cid/scripts/install.sh "0.11.12" "279aaa33e33a96c7c740d961e710de7f804bfeea13a374de80a4ae3a5452206c" "76A4948E69C62589C7B0AB84E414434DF5371FB6"
      - name: Action - helmfile-lint [deployment-helmfile-dev]
        env:
          CID_WORKFLOW: "${{ env.CID_WORKFLOW }}"
          CID_LOGLEVEL: "${{ env.CID_LOGLEVEL }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          cid --log-level=${CID_LOGLEVEL:-info} plan execute --state-file ".cid/state-github.json" --state-wf-name "main" --step "helmfile-lint-deployment-helmfile-dev"
      - name: Upload Outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "helmfile-lint-deployment-helmfile-dev-${{ github.run_id }}"
          path: ".dist/helmfile-lint-deployment-helmfile-dev/"
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 6
          include-hidden-files: true
  # sonarqube-scan
  sonarqube-scan:
    name: 'sonarqube-scan'
    runs-on: ubuntu-26.04
    permissions:
      actions: read # required: query workflow run metadata
      contents: read # required: checkout / repository metadata
      id-token: write # required: provenance signing
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-telemetry: true
          egress-policy: "${{ env.EGRESS_POLICY }}"
          allowed-endpoints: >-
            sonarcloud.io:443
            api.sonarcloud.io:443
            scanner.sonarcloud.io:443
            keyserver.ubuntu.com:443
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Prepare Tooling
        shell: bash
        run: bash .cid/scripts/install.sh "0.11.12" "279aaa33e33a96c7c740d961e710de7f804bfeea13a374de80a4ae3a5452206c" "76A4948E69C62589C7B0AB84E414434DF5371FB6"
      - name: Action - sonarqube-scan
        env:
          CID_WORKFLOW: "${{ env.CID_WORKFLOW }}"
          CID_LOGLEVEL: "${{ env.CID_LOGLEVEL }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          SONAR_HOST_URL: "${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}"
          SONAR_ORGANIZATION: "${{ secrets.SONAR_ORGANIZATION || vars.SONAR_ORGANIZATION }}"
          SONAR_PROJECTKEY: "${{ secrets.SONAR_PROJECTKEY || vars.SONAR_PROJECTKEY }}"
          SONAR_DEFAULT_BRANCH: "${{ secrets.SONAR_DEFAULT_BRANCH || vars.SONAR_DEFAULT_BRANCH }}"
          SONAR_REGION: "${{ secrets.SONAR_REGION || vars.SONAR_REGION }}"
          SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"
        run: |
          cid --log-level=${CID_LOGLEVEL:-info} plan execute --state-file ".cid/state-github.json" --state-wf-name "main" --step "sonarqube-scan"
      - name: Upload Outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "sonarqube-scan-${{ github.run_id }}"
          path: ".dist/sonarqube-scan/"
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 6
          include-hidden-files: true
